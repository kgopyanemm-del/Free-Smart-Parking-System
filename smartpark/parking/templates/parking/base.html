<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartPark {% block title %}{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #0077ff;
    --primary-dark: #0055cc;
    --success: #16a34a;
    --danger: #dc2626;
    --warning: #d97706;
    --bg: #0a0e1a;
    --bg2: #111827;
    --bg3: #1a2236;
    --border: #1e2d4a;
    --text: #e8eaf0;
    --muted: #8892a4;
    --available: #16a34a;
    --occupied: #dc2626;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .navbar {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .logo {
    font-family: 'Rajdhani', sans-serif;
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--text);
  }
  .logo span { color: var(--primary); }
  .container { max-width: 960px; margin: 0 auto; padding: 2rem 1.5rem; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 24px;
    border-radius: 8px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 1px;
    text-decoration: none;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
    text-transform: uppercase;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); }
  .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
  .btn-outline:hover { border-color: var(--primary); color: var(--primary); }
  .btn-success { background: var(--success); color: #fff; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-lg { padding: 16px 36px; font-size: 1.1rem; }
  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
  }
  .alert {
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 0.9rem;
    margin: 12px 0;
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .alert-success { background: #14532d22; border: 1px solid #16a34a55; color: #4ade80; }
  .alert-danger  { background: #7f1d1d22; border: 1px solid #dc262655; color: #f87171; }
  .alert-info    { background: #1e3a5f22; border: 1px solid #0077ff55; color: #60a5fa; }
  .alert-warning { background: #78350f22; border: 1px solid #d9770655; color: #fbbf24; }
  .page-title {
    font-family: 'Rajdhani', sans-serif;
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 0.25rem;
  }
  .page-sub { color: var(--muted); font-size: 0.95rem; margin-bottom: 1.5rem; }
  .breadcrumb { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 0.85rem; margin-bottom: 1.5rem; }
  .breadcrumb a { color: var(--primary); text-decoration: none; }
  .breadcrumb a:hover { text-decoration: underline; }
  .steps { display: flex; gap: 6px; margin-bottom: 2rem; }
  .step { flex: 1; height: 4px; border-radius: 2px; background: var(--border); }
  .step.done { background: var(--primary); }
  .step.active { background: var(--primary); opacity: 0.5; }
</style>
{% block extra_head %}{% endblock %}
</head>
<body>
<nav class="navbar">
  <a href="/" class="logo">Smart<span>Park</span></a>
 
</nav>
{% block content %}{% endblock %}
</body>
</html>
